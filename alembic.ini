# A3 Learning Agent System - Alembic migration config.
# Default DB is SQLite for the contest demo; switch by editing sqlalchemy.url
# or by exporting DATABASE_URL (env.py honors it).
# NOTE: keep this file pure ASCII so configparser does not blow up on
# Chinese Windows (CP936/GBK locale).

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///data/a3_learning.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
