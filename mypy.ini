; A3 mypy configuration - strict scope is A's recent services + adapters only.
; CI uses this file via `python -m mypy --config-file mypy.ini ...`.
; pyproject.toml retains the global lenient defaults so day-to-day dev is
; not gated; this file is the strict tier we run in CI and pre-commit.

[mypy]
python_version = 3.12
explicit_package_bases = True
follow_imports = silent
warn_unused_ignores = False
warn_return_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
ignore_missing_imports = True
strict_equality = True
disallow_untyped_decorators = True

; Strict modules: A's Day 5-9 services and research adapters.
[mypy-backend.app.services.question_bank]
strict = True

[mypy-backend.app.services.knowledge_index]
strict = True

[mypy-backend.app.services.realdina_service]
strict = True

[mypy-backend.app.research.evaluation.dina_real_adapter]
strict = True

[mypy-backend.app.research.evaluation.calibrated_adapter]
strict = True

[mypy-backend.app.services.diagnosis_reporter.*]
strict = True

[mypy-backend.app.api.v1.system]
strict = True

[mypy-backend.app.services.timemachine_service]
strict = True

[mypy-backend.app.services.knowledge_graph.retriever]
strict = True

[mypy-backend.app.services.knowledge_graph.store]
strict = True

[mypy-backend.app.services.spaced_repetition.hlr]
strict = True

[mypy-backend.app.services.cognitive_diagnosis.bloom_6x3]
strict = True

; A 6/24 新模块（P1.1 教学安全 / P1.2 证据链 / 桥接层 / PromptCache / HyDE+RRF）
[mypy-backend.app.services.pedagogical_safety]
strict = True

[mypy-backend.app.services.claim_ledger]
strict = True

[mypy-backend.app.services.pedagogical_bridge]
strict = True

[mypy-backend.app.services.prompt_cache]
strict = True

[mypy-backend.app.services.rag.hyde]
strict = True

[mypy-backend.app.services.rag.rrf]
strict = True

; Lenient modules: legacy / B-owned files we have not touched yet.
[mypy-backend.app.services.cognitive_diagnosis.*]
ignore_errors = True

[mypy-backend.app.services.knowledge_graph.*]
ignore_errors = True

[mypy-backend.app.services.spaced_repetition.*]
ignore_errors = True

[mypy-backend.app.research.models.*]
ignore_errors = True
