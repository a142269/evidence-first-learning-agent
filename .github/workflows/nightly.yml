name: Nightly offline suite

on:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * *'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: sqlite:///./build/nightly.db
      A3_OFFLINE_DEMO: 'true'
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare isolated database
        run: |
          mkdir -p build
          python -c "from backend.app.core.database import init_db; init_db()"
      - name: Run full offline suite
        run: pytest -o addopts= tests/ --benchmark-disable --cov=backend.app.agent_runtime --cov=backend.app.services.enterprise_retriever --cov=backend.app.services.v2_learning_tools --cov=backend.app.api.v2 --cov-report=xml:build/coverage.xml -q
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-core-coverage
          path: build/coverage.xml
          if-no-files-found: ignore

  linux-lockfile:
    name: Linux Python 3.12 lockfile generation and install
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: sqlite:///./build/lock_smoke.db
      A3_OFFLINE_DEMO: 'true'
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pip-tools
        run: python -m pip install --upgrade pip "pip-tools==7.4.1"
      # The committed requirements.lock.txt was generated on Windows; this job
      # proves a Linux 3.12 lock can be generated and installed. The artifact is
      # uploaded for a maintainer to review/commit as requirements.lock.linux.txt.
      - name: Generate Linux lock from requirements.txt
        run: |
          mkdir -p build
          python -m piptools compile --no-emit-index-url --no-emit-trusted-host \
            --strip-extras --generate-hashes \
            --output-file=build/requirements.lock.linux.txt requirements.txt
      - name: Install the generated Linux lock
        run: python -m pip install --require-hashes -r build/requirements.lock.linux.txt
      - name: Smoke imports and core learning-package tests
        run: |
          python -c "import fastapi, langgraph, sqlalchemy, psycopg; print('imports ok')"
          pytest tests/a/test_learning_package.py tests/a/test_learning_package_partial.py \
            tests/a/test_structured_output_robustness.py \
            --basetemp=build/pytest-lock -o addopts= --benchmark-disable -q
      - name: Upload generated Linux lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock-linux
          path: build/requirements.lock.linux.txt
          if-no-files-found: ignore
